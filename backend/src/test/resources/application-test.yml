spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

app:
  jwt:
    secret: TestSecretKeyForJWTMustBeAtLeast256BitsLongForHS256Algorithm!!
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  company:
    name: Test Snacks Pvt Ltd
    gstin: 33AABCS1234A1Z5
    address: Test Address
    state: Tamil Nadu
    state-code: "33"
    phone: "+91-431-0000000"
    email: test@test.com
  gst:
    default-rate: 5.0
    hsn-code: "2106"
  production:
    variance-tolerance: 3.0

